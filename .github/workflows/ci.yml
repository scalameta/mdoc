name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  checks:
    name: Scalafmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
      - run: ./bin/scalafmt --test
  docs:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt '++2.12.21; docs/mdoc'
  test-windows:
    name: "Windows"
    # MSVC 14.52 on windows-latest needs Clang 22, which Scala Native 0.5.12 does not support
    runs-on: windows-2022
    steps:
      - name: Install LLVM
        shell: pwsh
        run: |
          $retryCount = 3
          $retryDelay = 5  # seconds

          function InstallLLVM {
              Write-Host "Attempting to install LLVM (try $global:retryAttempt of $retryCount)..."
              choco install llvm --version="20.1.4" --allow-downgrade --force
              if ($LASTEXITCODE -ne 0) { throw "choco exited with code $LASTEXITCODE" }
          }

          # Attempt to install LLVM with retries
          for ($global:retryAttempt = 1; $global:retryAttempt -le $retryCount; $global:retryAttempt++) {
              try {
                  InstallLLVM
                  Write-Host "LLVM installation successful!"
                  break  # Exit the loop if installation is successful
              } catch {
                  Write-Host "Error installing LLVM: $_"
                  if ($global:retryAttempt -lt $retryCount) {
                      Write-Host "Retrying in $retryDelay seconds..."
                      Start-Sleep -Seconds $retryDelay
                  } else {
                      Write-Host "Maximum retry attempts reached. Exiting."
                      exit 1
                  }
              }
          }

      - name: Add LLVM on Path
        shell: pwsh
        run: echo "${env:ProgramFiles}\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert clang installed and on path
        shell: pwsh
        run: clang --version
        
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt '++2.13.18 test'
        shell: bash
  test:
    name: ${{ matrix.command }} ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
        command:
          # one alias per Scala version: ++ does not select matrix rows
          - "test212"
          - "test213"
          # Minimal supported version
          - "test33"
          - "test38"
          - "'++3.9.0 plugin/test'"
          - "'++2.12.21 scripted'"
          - "'++3.9.0 scripted'"
          - "'++3.10.1!; unit/test; worksheets/test'"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt ${{ matrix.command }}
